services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gym}
      POSTGRES_USER: ${DB_USERNAME:-gym}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gym} -d ${DB_DATABASE:-gym}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Собирает фронтенд в public/build и завершается.
  node:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules

volumes:
  pgdata:
  node_modules:

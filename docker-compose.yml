services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
      # vendor (тысячи PHP-файлов) живёт в volume, а не в папке проекта: на Windows/macOS
      # чтение через общую папку хоста — главный тормоз, каждый запрос трогал бы сотни файлов.
      - vendor:/var/www/vendor
    environment:
      # Скомпилированные шаблоны тоже вне общей папки.
      VIEW_COMPILED_PATH: /tmp/laravel-views
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gym}
      POSTGRES_USER: ${DB_USERNAME:-gym}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    # Порт только на localhost хоста: для GUI-клиента или SSH-туннеля, наружу не открыт.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gym} -d ${DB_DATABASE:-gym}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Веб-интерфейс к базе: http://localhost:8081 (только с этой машины или через SSH-туннель).
  adminer:
    image: adminer:4
    restart: unless-stopped
    # Слушаем IPv4 явно: стандартный [::] падает на хостах без IPv6.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

  # Собирает фронтенд в public/build и завершается.
  node:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules

volumes:
  pgdata:
  node_modules:
  vendor:

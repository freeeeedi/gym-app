memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Europe/Moscow

; OPcache: код проекта смонтирован с хоста, и на Windows/macOS каждая проверка файла медленная.
; Изменения в коде подхватываются не сразу, а в течение revalidate_freq секунд.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Кеш путей к файлам: меньше обращений к файловой системе на каждом include.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
